<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene harness — Embryo Engine</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
} }
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.core.js">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050605; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #dbg { position: fixed; left: 14px; bottom: 12px; margin: 0; font: 11px/1.45 'JetBrains Mono', ui-monospace, monospace;
         color: #8F8A80; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0"></canvas>
<div id="labels"></div>
<div id="hud"></div>
<pre id="dbg" hidden></pre>
<script type="module">
// Standalone harness for src/scene/**: renders createStage() fed by dev/mock-frames.js.
// URL: ?cells=10000 &tick=5000 &seed=1 &view=cells|depth|energy|age|midline|ap|activator|inhibitor &apart=1
//      &cam=specimen|close|map &auto=0 &q=high|medium|low &anim=1 &tps=60 &stats=1 &rm=1 &iso=TYPE &hover=IDX &pin=IDX
// Keys: 1–8 views · X apart · C camera · F frame · Q quality · I isolate · O turntable · Space pause (anim) · P pin hover
// window.EE: { stage, measure(ms), gpuBench(n), colorTest(), pickTest(n), lifecycle(k), shot() } for headless QA.
import { createStage } from '../src/scene/stage.js';
import { makeMockFrame, MOCK_PARAMS, MOCK_FIELD_INFO, mockTransferList } from './mock-frames.js';
import { VIEWS, CAMERA_PRESETS, TISSUE_HEX, GRID } from '../src/shared.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const cfg = {
  cells: num('cells', 10000), seed: num('seed', 1), view: q.get('view') || 'cells', apart: q.get('apart') === '1',
  cam: q.get('cam') || 'specimen', auto: q.get('auto') !== '0', quality: q.get('q') || 'medium', anim: q.get('anim') === '1',
  tps: num('tps', 60), stats: q.get('stats') === '1', reduced: q.get('rm') === '1', iso: num('iso', 0),
  hover: q.has('hover') ? num('hover', -1) : null, pin: q.has('pin') ? num('pin', -1) : null,
};
cfg.tick = num('tick', cfg.cells <= 37 ? 0 : 5000);

const canvas = document.getElementById('stage');
const dbg = document.getElementById('dbg');
dbg.hidden = !cfg.stats;

let stage = null;
async function boot() {
  stage = await createStage(canvas, {
    quality: cfg.quality, reducedMotion: cfg.reduced, labelsRoot: document.getElementById('labels'),
    onUserCamera: () => { cfg.auto = false; stage.setAutoFrame(false); },
  });
  stage.setFieldInfo(MOCK_FIELD_INFO, MOCK_PARAMS);
  stage.setView(cfg.view);
  if (cfg.iso) stage.setIsolate(cfg.iso);
  return stage;
}
await boot();
window.addEventListener('resize', () => stage.resize());

// ── frames: static (main thread) or animated (blob module worker running the mock chain) ──
let latest = null, visTick = 0, lastStatsAt = 0, paused = false;
function onFrame(f, fromWorker) {
  stage.setFrame(f);
  latest = { tick: f.tick, prevTick: f.prevTick, running: f.running, stats: f.stats };
  const now = performance.now();
  if (now - lastStatsAt > 100 || !fromWorker) { stage.setStats(f.stats); lastStatsAt = now; }
}

let worker = null, staticFrame = null;
if (cfg.anim) {
  const mockUrl = new URL('./mock-frames.js', import.meta.url).href;
  const src = `
    import { makeMockFrame, mockTransferList } from '${mockUrl}';
    let f = null, id = 0, pool = [], credits = 2, c = null, run = true;
    onmessage = (e) => {
      const m = e.data;
      if (m.type === 'init') { c = m; f = makeMockFrame({ cells: m.cells, tick: m.tick, seed: m.seed, running: true }); id = 1; send(); setInterval(tick, m.interval); }
      else if (m.type === 'ack') { pool.push(m.buffers); credits++; }
      else if (m.type === 'run') run = m.on;
    };
    function send() { credits--; postMessage(f, mockTransferList(f)); }
    function tick() {
      if (credits <= 0) return;
      if (!run) return;
      f = makeMockFrame({ prev: f, id: ++id, tick: f.tick + c.step, buffers: pool.shift() || null, running: run });
      send();
    }`;
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { type: 'module' });
  worker.onmessage = (e) => {
    const f = e.data;
    onFrame(f, true);
    worker.postMessage({ type: 'ack', buffers: { cell: f.cell, life: f.life, idx: f.idx, events: f.events, morph: f.morph } },
      mockTransferList(f));
  };
  const fps = 15;
  worker.postMessage({ type: 'init', cells: cfg.cells, tick: cfg.tick, seed: cfg.seed, interval: 1000 / fps, step: Math.max(1, Math.round(cfg.tps / fps)) });
} else {
  staticFrame = makeMockFrame({ cells: cfg.cells, tick: cfg.tick, seed: cfg.seed, running: false });
  onFrame(staticFrame, false);
  visTick = staticFrame.prevTick;
}
function pose() {
  stage.setCamera(cfg.cam);
  stage.setAutoFrame(cfg.auto);
  if (cfg.apart) stage.setExploded(true);
  if (cfg.hover !== null || cfg.pin !== null) stage.setHighlight({ hover: cfg.hover, pinned: cfg.pin });
}
pose();

// ── display clock (main.js does this in the app; SPEC §3.6.4) ──
function clock(dt) {
  if (!latest) return;
  const running = latest.running && !paused;
  const rate = running ? Math.max(latest.stats?.tps?.actual || cfg.tps, 1) : 2.5;
  visTick = Math.min(latest.tick, Math.max(latest.prevTick, visTick + dt * rate));
  if (latest.tick - visTick > 3 * Math.max(1, latest.tick - latest.prevTick)) visTick = latest.prevTick;
  const r = cfg.reduced ? [0.12, 0.12, 0.12] : [0.40, 0.45, 0.30];
  stage.setClock({ visRel: visTick - latest.tick, tauBirth: Math.max(1, r[0] * rate), tauDeath: Math.max(1, r[1] * rate), tauFate: Math.max(1, r[2] * rate) });
}

let last = performance.now(), force = 0, renders = 0;
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  clock(dt);
  if (force > now || (cfg.anim && !paused) || stage.needsRender() || (latest && visTick < latest.tick)) { stage.render(dt, now); renders++; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── pointer: hover picking (30 Hz) and click-to-pin ──
let hover = cfg.hover, pinned = cfg.pin, lastPick = 0, down = null;
canvas.addEventListener('pointermove', (e) => {
  const now = performance.now();
  if (now - lastPick < 33) return;
  lastPick = now;
  const i = stage.pick(e.clientX, e.clientY);
  if (i !== hover) { hover = i; stage.setHighlight({ hover, pinned }); }
});
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  if (performance.now() - down.t < 300 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
    pinned = stage.pick(e.clientX, e.clientY);
    stage.setHighlight({ hover, pinned });
  }
  down = null;
});

// ── keys ──
let camIdx = CAMERA_PRESETS.indexOf(cfg.cam), exploded = cfg.apart, qIdx = ['high', 'medium', 'low'].indexOf(cfg.quality), iso = cfg.iso, turn = false;
window.addEventListener('keydown', (e) => {
  const v = VIEWS.find((x) => x.key === e.key);
  if (v) stage.setView(v.id);
  else if (e.key === 'x' || e.key === 'X') stage.setExploded((exploded = !exploded));
  else if (e.key === 'c' || e.key === 'C') { camIdx = (camIdx + 1) % 3; stage.setCamera(CAMERA_PRESETS[camIdx]); }
  else if (e.key === 'f' || e.key === 'F') { stage.setAutoFrame(true); stage.frameOrganism(); }
  else if (e.key === 'q' || e.key === 'Q') { qIdx = (qIdx + 1) % 3; stage.setQuality(['high', 'medium', 'low'][qIdx]); }
  else if (e.key === 'i' || e.key === 'I') { iso = (iso + 1) % 8; stage.setIsolate(iso || null); }
  else if (e.key === 'o' || e.key === 'O') { turn = !turn; stage.setTurntable(turn); }
  else if (e.key === ' ') { paused = !paused; worker?.postMessage({ type: 'run', on: !paused }); }
  else if (e.key === 'ArrowLeft') stage.orbitBy(-10, 0);
  else if (e.key === 'ArrowRight') stage.orbitBy(10, 0);
  else if (e.key === 'ArrowUp') stage.orbitBy(0, 5);
  else if (e.key === 'ArrowDown') stage.orbitBy(0, -5);
  else if (e.key === '+' || e.key === '=') stage.zoomBy(0.85);
  else if (e.key === '-') stage.zoomBy(1 / 0.85);
});

// ── debug overlay ──
if (cfg.stats) setInterval(() => {
  const s = stage.frameStats(), g = stage.getQuality();
  dbg.textContent = `${g.tier} @${g.dpr}x  ${s.fps.toFixed(0)} fps  p90 ${s.p90ms.toFixed(1)} ms  cpu ${s.cpuMs.toFixed(2)} ms\n` +
    `draws ${s.drawCalls}  tris ${(s.triangles / 1e6).toFixed(2)}M  cells ${latest?.stats?.cellCount ?? 0}  T ${latest?.tick ?? 0}  renders ${renders}`;
}, 500);

// ── QA probes ──
const glOf = () => stage._debug.renderer.getContext();
function syncGPU() { const px = new Uint8Array(4); const gl = glOf(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
function hexLab(hex) { return rgbLab([1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16))); }
function rgbLab([R, G, B]) {
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const r = lin(R), g = lin(G), b = lin(B);
  const X = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, Y = 0.2126 * r + 0.7152 * g + 0.0722 * b, Z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
function dE2000([L1, a1, b1], [L2, a2, b2]) {
  const d2r = Math.PI / 180, C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cb = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Cb ** 7 / (Cb ** 7 + 25 ** 7)));
  const a1p = a1 * (1 + G), a2p = a2 * (1 + G), C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h1p = (Math.atan2(b1, a1p) / d2r + 360) % 360, h2p = (Math.atan2(b2, a2p) / d2r + 360) % 360;
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = h2p - h1p; if (C1p * C2p === 0) dhp = 0; else if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin((dhp / 2) * d2r);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p; if (C1p * C2p !== 0) hbp = Math.abs(h1p - h2p) > 180 ? (h1p + h2p + 360) / 2 : (h1p + h2p) / 2;
  const T = 1 - 0.17 * Math.cos((hbp - 30) * d2r) + 0.24 * Math.cos(2 * hbp * d2r) + 0.32 * Math.cos((3 * hbp + 6) * d2r) - 0.2 * Math.cos((4 * hbp - 63) * d2r);
  const dth = 30 * Math.exp(-(((hbp - 275) / 25) ** 2)), RC = 2 * Math.sqrt(Cbp ** 7 / (Cbp ** 7 + 25 ** 7));
  const SL = 1 + (0.015 * (Lbp - 50) ** 2) / Math.sqrt(20 + (Lbp - 50) ** 2), SC = 1 + 0.045 * Cbp, SH = 1 + 0.015 * Cbp * T;
  const RT = -Math.sin(2 * dth * d2r) * RC;
  return Math.sqrt((dLp / SL) ** 2 + (dCp / SC) ** 2 + (dHp / SH) ** 2 + RT * (dCp / SC) * (dHp / SH));
}

window.EE = {
  stage, cfg,
  /** Force continuous rendering for `ms`, then return frameStats (rAF-interval p90). */
  measure(ms = 3000) {
    stage.resetFrameStats();
    force = performance.now() + ms;
    return new Promise((res) => setTimeout(() => res({ ...stage.frameStats(), quality: stage.getQuality(), size: [innerWidth, innerHeight] }), ms + 50));
  },
  /** Synchronous GPU throughput: n full renders, then a readPixels sync. Returns ms/frame. */
  gpuBench(n = 60) {
    syncGPU();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) stage.render(1 / 60, t0 + i * 16.7);
    syncGPU();
    return { msPerFrame: (performance.now() - t0) / n, quality: stage.getQuality(), stats: stage.frameStats() };
  },
  /** Map preset colour fidelity: centre-top of interior tissue columns vs legend swatches (ΔE2000). */
  colorTest() {
    const cellArr = stage._debug.cells.cell, dpr = stage.getQuality().dpr, gl = glOf();
    stage.render(1 / 60, performance.now());
    const out = {};
    const px = new Uint8Array(4 * 9);
    for (let type = 1; type <= 7; type++) {
      const cands = [];
      for (let i = 0; i < GRID * GRID && cands.length < 400; i += 7) {
        if (cellArr[4 * i] !== type) continue;
        const x = i % GRID, y = (i / GRID) | 0;
        let ok = true;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (cellArr[4 * (((y + dy + GRID) % GRID) * GRID + ((x + dx + GRID) % GRID))] !== type) ok = false;
        if (ok) cands.push(i);
      }
      if (!cands.length) continue;
      const des = [];
      for (const i of cands.slice(0, 12)) {
        const p = stage.projectCell(i);
        if (!p.visible) continue;
        const X = Math.round(p.x * dpr), Y = Math.round(gl.drawingBufferHeight - p.y * dpr);
        gl.readPixels(X - 1, Y - 1, 3, 3, gl.RGBA, gl.UNSIGNED_BYTE, px);
        const avg = [0, 1, 2].map((c) => { let s = 0; for (let k = 0; k < 9; k++) s += px[4 * k + c]; return s / 9; });
        des.push({ rgb: avg.map(Math.round), dE: dE2000(rgbLab(avg), hexLab(TISSUE_HEX[type])) });
      }
      if (des.length) out[type] = { legend: TISSUE_HEX[type], meanDE: +(des.reduce((a, b) => a + b.dE, 0) / des.length).toFixed(2), sample: des[0].rgb };
    }
    return out;
  },
  /** pick(projectCell(i)) === i for n random visible live cells. */
  pickTest(n = 200) {
    const cellArr = stage._debug.cells.cell, r = canvas.getBoundingClientRect();
    let tried = 0, ok = 0, seed = 7;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
    for (let guard = 0; guard < 200000 && tried < n; guard++) {
      const i = Math.floor(rnd() * GRID * GRID);
      if (!cellArr[4 * i]) continue;
      const p = stage.projectCell(i);
      if (!p.visible) continue;
      tried++;
      if (stage.pick(r.left + p.x, r.top + p.y) === i) ok++;
    }
    return { tried, ok, pct: tried ? +((100 * ok) / tried).toFixed(1) : 0 };
  },
  /** Render-on-demand check: renders during `ms` of idleness. */
  async idleRenders(ms = 2000) { const r0 = renders; await new Promise((r) => setTimeout(r, ms)); return { renders: renders - r0, perSec: (renders - r0) / (ms / 1000) }; },
  labels() { return stage._debug.labels?.visible(); },
  /** dispose() → createStage() on the same canvas, k times; reports renderer.info.memory around each dispose. */
  async lifecycle(k = 3) {
    const out = [];
    for (let n = 0; n < k; n++) {
      stage.render(1 / 60, performance.now());
      const r = stage._debug.renderer, live = { ...r.info.memory, programs: r.info.programs?.length ?? 0 };
      stage.dispose();
      out.push({ cycle: n + 1, live, afterDispose: { ...r.info.memory } });
      await boot();
      if (staticFrame) { stage.setFrame(staticFrame); stage.setStats(staticFrame.stats); }
      pose();
      EE.stage = stage;
      await new Promise((res) => setTimeout(res, 300));
    }
    return out;
  },
};
window.EE_READY = true;
</script>
</body>
</html>
